<style>
  /* === ESTILOS GENERALES === */
  body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; overflow: hidden; }
  #map { height: 100vh; width: 100%; z-index: 1; }

  /* === CONTROLES FLOTANTES (Selector y Leyenda) === */
  .floating-ctrl {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px); /* Efecto vidrio */
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.6);
    z-index: 1000;
  }

  /* === SELECTOR SUPERIOR === */
  .selector-container {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 90%;
    max-width: 400px;
  }
  
  select#filtroEstaciones {
    width: 100%;
    padding: 10px 15px;
    font-size: 16px;
    font-family: 'Poppins', sans-serif;
    color: #333;
    background-color: transparent;
    border: 1px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s ease;
  }
  select#filtroEstaciones:hover { border-color: #0077b6; }
  select#filtroEstaciones:focus { border-color: #0077b6; box-shadow: 0 0 0 3px rgba(0,119,182,0.2); }

  /* === ESTILO PARA EL TOOLTIP (Nombre al pasar el mouse) === */
  .custom-tooltip {
    background-color: #333 !important;
    color: #fff !important;
    border: 1px solid #fff !important;
    border-radius: 4px;
    padding: 4px 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  /* === POPUP CARD (Diseño Tarjeta) === */
  .popup-card {
    font-family: 'Poppins', sans-serif;
    background: #ffffff;
    padding: 10px;
    border-radius: 12px;
    min-width: 280px;
    max-width: 320px;
  }
  .leaflet-popup-content-wrapper {
    border-radius: 16px;
    padding: 0;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  .leaflet-popup-content { margin: 0; width: auto !important; }

  .popup-card .titulo {
    background: linear-gradient(135deg, #0077b6, #0096c7);
    color: white;
    padding: 12px;
    border-radius: 12px 12px 0 0;
    font-weight: 600;
    text-align: center;
    font-size: 1.1em;
    margin: -10px -10px 10px -10px; 
  }

  .popup-card .dato {
    margin: 6px 0;
    font-size: 0.95em;
    color: #444;
    padding: 6px 10px;
    border-radius: 6px;
    background: #f8f9fa;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 3px solid transparent;
  }
  .popup-card .dato:hover { border-left: 3px solid #0077b6; background: #f1f3f5; }
  .popup-card .label { font-weight: 600; color: #023e8a; }
  hr { border: 0; border-top: 1px solid #eee; margin: 8px 0; }

  /* === LEYENDA INFERIOR === */
  .leyenda-container {
    position: absolute;
    bottom: 30px;
    right: 20px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .leyenda-item { display: flex; align-items: center; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    display: inline-block; margin-right: 8px;
    box-shadow: 0 0 2px rgba(0,0,0,0.3);
    border: 1px solid white;
  }

  /* === TITULO MAPA === */
  .map-title-bottom h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin: 0;
    padding: 8px 16px;
    background: rgba(255,255,255,0.9);
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  /* === RESPONSIVE === */
  @media (max-width: 768px) {
    .selector-container { width: 85%; top: 10px; }
    .popup-card { min-width: 250px; }
    .leyenda-container { bottom: 25px; right: 10px; max-width: 200px; }
  }
</style>

// ======= FUNCIONES AUXILIARES =======
function convertirGradosAPuntoCardinal(grados){
  const direcciones = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return direcciones[Math.round(grados/22.5)%16];
}

async function cargarDatosITALCA20(urlDatos, nombre){
  try{
    const proxyUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(urlDatos);
    const response = await fetch(proxyUrl);
    const data = await response.json();
    const obs = data.observations[0];
    const fechaObj = new Date(obs.obsTimeLocal);
    const dia = String(fechaObj.getDate()).padStart(2,'0');
    const mes = String(fechaObj.getMonth()+1).padStart(2,'0');
    const año = fechaObj.getFullYear();
    const hora = String(fechaObj.getHours()).padStart(2,'0') + ':' + String(fechaObj.getMinutes()).padStart(2,'0');
    const direccionGrados = obs.winddir || 0;
    const direccionCardinal = convertirGradosAPuntoCardinal(direccionGrados);
    const velocidadNudos = (obs.imperial.windSpeed*0.868976).toFixed(1);
    const rachasNudos = (obs.imperial.windGust*0.868976).toFixed(1);
    const temperaturaC = ((obs.imperial.temp-32)*5/9).toFixed(1);
    const puntoRocioC = ((obs.imperial.dewpt-32)*5/9).toFixed(1);
    const presionhPa = (obs.imperial.pressure*33.8639).toFixed(1);
    const humedad = obs.humidity;

    return `
      <div class="popup-card">
        <div class="titulo">📡 ${nombre}</div>
        <div class="dato" style="justify-content:center; color:#555;">📅 Act: ${dia}/${mes}/${año} ${hora}</div>
        <hr>
        <div class="dato"><span class="label">🌡 Temp:</span> ${temperaturaC} °C</div>
        <div class="dato"><span class="label">💧 Humedad:</span> ${humedad} %</div>
        <div class="dato"><span class="label">🌫 Rocío:</span> ${puntoRocioC} °C</div>
        <div class="dato"><span class="label">🧭 Presión:</span> ${presionhPa} hPa</div>
        <div class="dato"><span class="label">🌬 Viento:</span> ${direccionCardinal} ${velocidadNudos} nds</div>
        <div class="dato"><span class="label">💨 Rachas:</span> ${rachasNudos} nds</div>
      </div>`;
  }catch(e){ return "<div class='popup-card'>Error al cargar datos ITALCA20</div>"; }
}

async function cargarDatos(urlDatos, nombre){
  try{
    const response = await fetch(urlDatos);
    const texto = await response.text();
    const lineas = texto.trim().split('\n');
    const ultimaLinea = lineas[lineas.length-1];
    const datos = ultimaLinea.trim().split(/\s+/);
    const fecha = datos[0] || "-";
    const hora = datos[1] || "-";
    const direccionGrados = parseFloat(datos[7]||0);
    const intensidadNudos = datos[5]||0;
    const direccionCardinal = convertirGradosAPuntoCardinal(direccionGrados);
    return `
      <div class="popup-card">
        <div class="titulo">📡 ${nombre}</div>
        <div class="dato" style="justify-content:center; color:#555;">📅 Act: ${fecha} ${hora}</div>
        <hr>
        <div class="dato"><span class="label">🌡 Temp:</span> ${datos[2]||"-"} °C</div>
        <div class="dato"><span class="label">💧 Humedad:</span> ${datos[3]||"-"} %</div>
        <div class="dato"><span class="label">🌫 Rocío:</span> ${datos[4]||"-"} °C</div>
        <div class="dato"><span class="label">🧭 Presión:</span> ${datos[10]||"-"} hPa</div>
        <div class="dato"><span class="label">🌬 Viento:</span> ${direccionCardinal} ${intensidadNudos} nds</div>
        <div class="dato"><span class="label">💨 Rachas:</span> ${datos[40]||"-"} nds</div>
        <div class="dato"><span class="label">🌧️ Lluvia:</span> ${datos[9]||"-"} mm</div>
      </div>`;
  }catch(e){ return "<div class='popup-card'>Error al cargar los datos.</div>"; }
}

async function cargarDatosWeatherLink(urlDatos, nombre){
  try{
    const response = await fetch(urlDatos);
    let datos = await response.json();
    let ultimaAct;
    if(datos.ts || datos.time){
      const ts = new Date(datos.ts || datos.time);
      ultimaAct = ts.toLocaleString("es-CL", {hour12:false});
    } else {
      ultimaAct = new Date().toLocaleString("es-CL", {hour12:false});
    }
    const dir = datos.windDirection || 0;
    const spd = datos.wind || 0;
    const racha = datos.gust || 0;
    return `
      <div class="popup-card">
        <div class="titulo">🌐 ${nombre}</div>
        <div class="dato" style="justify-content:center; color:#555;">📅 Act: ${ultimaAct}</div>
        <hr>
        <div class="dato"><span class="label">🌡 Temp:</span> ${datos.temperature || "-"} °C</div>
        <div class="dato"><span class="label">💧 Humedad:</span> ${datos.humidity || "-"} %</div>
        <div class="dato"><span class="label">🧭 Presión:</span> ${datos.barometer || "-"} hPa</div>
        <div class="dato"><span class="label">🌬 Viento:</span> ${convertirGradosAPuntoCardinal(dir)} ${spd} nds</div>
        <div class="dato"><span class="label">💨 Rachas:</span> ${racha} nds</div>
        <div class="dato"><span class="label">🌧️ Lluvia:</span> ${datos.rain || "-"} mm</div>
      </div>`;
  }catch(e){ return "<div class='popup-card'>Error al cargar WeatherLink</div>"; }
}


// ======= MAPA =======
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 });
const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' });
const map = L.map('map',{layers:[osm]}).setView([-41.5,-73],7);
L.control.layers({"Mapa":osm,"Satélite Google":googleSat},null,{position:'topleft'}).addTo(map);

const tituloControlBottom = L.control({position:'bottomleft'});
tituloControlBottom.onAdd=function(map){ 
  const div = L.DomUtil.create('div','map-title-bottom'); 
  div.innerHTML='<h2>Estaciones Meteorológicas Automáticas</h2>'; 
  return div; 
};
tituloControlBottom.addTo(map);

let marcadores = [];

async function mostrarEstaciones(lista){
  marcadores.forEach(m => map.removeLayer(m));
  marcadores = [];

  lista.forEach(est => {
    const colorMarcador = (est.tipo === "italca") ? "purple" : (est.tipo === "weatherlink") ? "#1E90FF" : "green";

    const marker = L.circleMarker([est.lat, est.lng], {
      radius: 10,
      color: "#ffffff",
      fillColor: colorMarcador,
      fillOpacity: 0.8,
      weight: 2
    }).addTo(map);

    // --- NUEVO: NOMBRE AL PASAR EL MOUSE (Tooltip) ---
    marker.bindTooltip(est.nombre, { 
        direction: 'top', 
        offset: [0, -10], 
        className: 'custom-tooltip' 
    });

    // --- NUEVO: RESALTE AL PASAR EL MOUSE (Efecto Visual) ---
    marker.on('mouseover', function (e) {
      this.setRadius(14); // Agranda el círculo
      this.setStyle({ weight: 4, fillOpacity: 1 });
    });

    marker.on('mouseout', function (e) {
      this.setRadius(10); // Vuelve al tamaño normal
      this.setStyle({ weight: 2, fillOpacity: 0.8 });
    });

    marcadores.push(marker);

    // Verificar si está fuera de línea (Lógica original)
    (async()=>{
      let ultimaFecha;
      try {
        if(est.tipo === "weatherlink"){
          const response = await fetch(est.urlDatos);
          const datos = await response.json();
          const ts = datos.ts || datos.time;
          if(ts) ultimaFecha = new Date(ts);
        } else if(est.tipo === "italca") {
           // Omitido para ITALCA según original
        } else {
          const response = await fetch(est.urlDatos);
          const texto = await response.text();
          const lineas = texto.trim().split('\n');
          const ultimaLinea = lineas[lineas.length-1];
          const datos = ultimaLinea.trim().split(/\s+/);
          const fecha = datos[0] || "-";
          const hora = datos[1] || "-";
          if(fecha !== "-" && hora !== "-"){
            const partes = fecha.split("-");
            const dia = parseInt(partes[0],10);
            const mes = parseInt(partes[1],10)-1;
            let anio = parseInt(partes[2],10);
            if(anio<100) anio += 2000;
            const partesHora = hora.split(":");
            const horas = parseInt(partesHora[0],10);
            const minutos = parseInt(partesHora[1],10);
            const segundos = parseInt(partesHora[2],10);
            ultimaFecha = new Date(anio, mes, dia, horas, minutos, segundos);
          }
        }
      } catch(e){ }

      if(ultimaFecha){
        const diffMin = (new Date() - ultimaFecha)/1000/60;
        if(diffMin>10){
          marker.setStyle({color:"#ffffff", fillColor:"#FF4500"}); // Naranja si está caído
        }
      }
    })();

    marker.on('click', async ()=> {
      let contenido;
      if(est.tipo==="italca"){
        contenido = await cargarDatosITALCA20(est.urlDatos, est.nombre);
      } else if(est.tipo==="weatherlink"){
        contenido = await cargarDatosWeatherLink(est.urlDatos, est.nombre);
      } else {
        contenido = await cargarDatos(est.urlDatos, est.nombre);
      }
      marker.bindPopup(contenido).openPopup();
    });
  });
}

// ======= FILTRO =======
document.getElementById("filtroEstaciones").addEventListener("change", function(){
  const valor = this.value.toLowerCase();
  let listaMostrar;
  const normalizar = str => str.toLowerCase().trim();

  if(valor === "todas"){
    listaMostrar = estaciones;
  } else if(valor === "cuarzona"){
    listaMostrar = estaciones.filter(e => grupoCuarzona.some(g => normalizar(g) === normalizar(e.nombre)));
  } else if(valor === "prizona"){
    listaMostrar = estaciones.filter(e => grupoPrizona.some(g => normalizar(g) === normalizar(e.nombre)));
  } else if(valor === "sezona"){
    listaMostrar = estaciones.filter(e => grupoSezona.some(g => normalizar(g) === normalizar(e.nombre)));
  } else if(valor === "quinzona"){
    listaMostrar = estaciones.filter(e => grupoQuinzona.some(g => normalizar(g) === normalizar(e.nombre)));
  } else if(valor === "terzona"){
    listaMostrar = estaciones.filter(e => grupoTerzona.some(g => normalizar(g) === normalizar(e.nombre)));
  } else {
    listaMostrar = estaciones;
  }
  mostrarEstaciones(listaMostrar);
});

// Inicializar
mostrarEstaciones(estaciones);

</script>
