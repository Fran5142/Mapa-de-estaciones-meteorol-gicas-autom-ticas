<style>
:root{--ink:#eaf4ff;--muted:#a9c3d8;--panel:rgba(7,24,43,.9);--line:rgba(160,205,232,.2);--cyan:#5ee7f5;--shadow:0 22px 65px rgba(0,10,24,.38)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:'Poppins',sans-serif;background:#081a2a;color:var(--ink)}
body{overflow:hidden}
#map{height:100vh;width:100%;z-index:1;background:#dce8ed}
.floating-ctrl{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);color:var(--ink)}
.topbar{position:absolute;z-index:1000;top:16px;left:50%;transform:translateX(-50%);width:min(1040px,calc(100vw - 36px));padding:12px 16px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(165px,.72fr) minmax(260px,1.2fr) auto;align-items:center;gap:12px;border-radius:17px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#5ee7f5,#147de2);font-size:19px;box-shadow:0 8px 24px #147de259}
.brand h1{font-size:13px;line-height:1.25;margin:0;font-weight:600;white-space:nowrap}
.brand p{font-size:9px;color:var(--muted);margin:3px 0 0;letter-spacing:.1em;text-transform:uppercase}
.control-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
select#filtroEstaciones,.search-wrap input{width:100%;height:40px;padding:9px 12px;font:inherit;font-size:12px;color:var(--ink);background:rgba(229,244,255,.08);border:1px solid var(--line);border-radius:11px;outline:none;transition:.2s}
select#filtroEstaciones option{color:#132b40;background:#fff}
select#filtroEstaciones:focus,.search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #5ee7f522}
.search-wrap{position:relative}
.search-wrap input{padding-left:36px}
.search-icon{position:absolute;left:12px;top:8px;color:#90adbf;font-size:17px;pointer-events:none}
.view-button{height:40px;padding:0 15px;border:0;border-radius:11px;background:linear-gradient(120deg,#11b8c9,#147de2);color:white;font:600 11px 'Poppins',sans-serif;white-space:nowrap;cursor:pointer;box-shadow:0 7px 18px #147de244;transition:transform .18s,filter .18s}
.view-button:hover{filter:brightness(1.12);transform:translateY(-1px)}
.view-button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.leyenda-container{position:absolute;z-index:1000;right:22px;bottom:28px;font-size:11px;padding:15px 17px;display:flex;flex-direction:column;gap:10px;min-width:176px}
.legend-title{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.leyenda-item{display:flex;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:9px;box-shadow:0 0 10px currentColor;border:1px solid #fffa}
.custom-tooltip{background:#07182b!important;color:#fff!important;border:1px solid #5ee7f580!important;border-radius:9px;padding:6px 10px;font:11px 'Poppins',sans-serif;box-shadow:0 8px 20px #0004}
.popup-card{font-family:'Poppins',sans-serif;background:#fff;padding:10px;border-radius:15px;min-width:270px;max-width:320px;color:#334155}
.leaflet-popup-content-wrapper{border-radius:17px;padding:0;overflow:hidden;box-shadow:0 15px 38px #0005}
.leaflet-popup-content{margin:0;width:auto!important}
.popup-card .titulo{background:linear-gradient(120deg,#073b65,#087fbd 60%,#24bacb);color:white;padding:13px 12px;border-radius:14px 14px 0 0;font-weight:600;text-align:center;font-size:1em;margin:-10px -10px 10px}
.popup-card .dato{margin:5px 0;font-size:.88em;color:#405366;padding:7px 10px;border-radius:8px;background:#f2f7fa;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent}
.popup-card .dato:hover{border-left-color:#11a9d0;background:#eaf5fa}
.popup-card .label{font-weight:600;color:#075985}
hr{border:0;border-top:1px solid #e8eef2;margin:8px 0}
.leaflet-control-layers{border:1px solid var(--line)!important;border-radius:12px!important;overflow:hidden;box-shadow:var(--shadow)!important}
.leaflet-control-layers-toggle{width:40px!important;height:40px!important}
.leaflet-control-layers-expanded{background:#07182bed;color:#eaf4ff;padding:10px 12px}
.leaflet-control-layers-separator{border-top-color:var(--line)}
.leaflet-control-attribution{font-size:9px}
.leaflet-top.leaflet-right{top:82px}
@media(max-width:950px){
  .topbar{top:10px;width:calc(100vw - 20px);padding:11px;grid-template-columns:minmax(0,1fr) auto;gap:9px}
  .brand{grid-column:1/-1}
  .brand p{display:none}
  .brand h1{font-size:12px}
  .topbar select#filtroEstaciones{grid-column:1}
  .search-wrap{grid-column:2;min-width:0;width:min(42vw,270px)}
  .view-button{grid-column:1/-1;width:100%;height:36px}
  .leyenda-container{right:12px;bottom:20px;padding:11px 13px;min-width:145px;gap:7px;font-size:10px}
  .leaflet-top.leaflet-right{top:205px}
}
@media(max-width:390px){
  .topbar{grid-template-columns:1fr 1fr}
  .topbar select#filtroEstaciones,.topbar .search-wrap{width:100%;min-width:0}
  .view-button{grid-column:1/-1}
}
</style>
</head>

function convertirGradosAPuntoCardinal(grados){
  const direcciones=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return direcciones[Math.round(grados/22.5)%16];
}

async function cargarDatosITALCA20(urlDatos,nombre){
  try{
    const response=await fetch(urlDatos);
    if(!response.ok) throw new Error(`Error de conexión: ${response.status}`);
    const data=await response.json();
    if(!data||!data.observations||data.observations.length===0) throw new Error("Estación fuera de línea (sin datos).");

    const obs=data.observations[0];
    const fechaObj=new Date(obs.obsTimeLocal);
    const dia=String(fechaObj.getDate()).padStart(2,'0');
    const mes=String(fechaObj.getMonth()+1).padStart(2,'0');
    const año=fechaObj.getFullYear();
    const hora=String(fechaObj.getHours()).padStart(2,'0')+':'+String(fechaObj.getMinutes()).padStart(2,'0');
    const direccionCardinal=convertirGradosAPuntoCardinal(obs.winddir||0);
    if(!obs.imperial) throw new Error("Formato de datos incorrecto de Wunderground.");

    const velocidadNudos=(obs.imperial.windSpeed*0.868976).toFixed(1);
    const rachasNudos=(obs.imperial.windGust*0.868976).toFixed(1);
    const temperaturaC=((obs.imperial.temp-32)*5/9).toFixed(1);
    const puntoRocioC=((obs.imperial.dewpt-32)*5/9).toFixed(1);
    const presionhPa=(obs.imperial.pressure*33.8639).toFixed(1);
    const humedad=obs.humidity;
    const lluviaMm=((obs.imperial.precipTotal||0)*25.4).toFixed(1);

    return `<div class="popup-card">
      <div class="titulo">📡 ${nombre}</div>
      <div class="dato" style="justify-content:center;color:#555;">📅 Act: ${dia}/${mes}/${año} ${hora}</div><hr>
      <div class="dato"><span class="label">🌡 Temp:</span> ${temperaturaC} °C</div>
      <div class="dato"><span class="label">💧 Humedad:</span> ${humedad} %</div>
      <div class="dato"><span class="label">🌫 Rocío:</span> ${puntoRocioC} °C</div>
      <div class="dato"><span class="label">🧭 Presión:</span> ${presionhPa} hPa</div>
      <div class="dato"><span class="label">🌬 Viento:</span> ${direccionCardinal} ${velocidadNudos} nds</div>
      <div class="dato"><span class="label">💨 Rachas:</span> ${rachasNudos} nds</div>
      <div class="dato"><span class="label">🌧️ Lluvia:</span> ${lluviaMm} mm</div>
    </div>`;
  }catch(e){
    console.error(`Fallo en ${nombre}:`,e);
    return `<div class="popup-card"><div class="titulo" style="background:#d90429;">⚠️ ${nombre}</div>
      <div class="dato" style="justify-content:center;color:#d90429;font-weight:bold;">Error: ${e.message}</div></div>`;
  }
}

async function cargarDatos(urlDatos,nombre){
  try{
    const response=await fetch(urlDatos);
    if(!response.ok) throw new Error(`Error de conexión: ${response.status}`);
    const texto=await response.text();
    const lineas=texto.trim().split('\n');
    const datos=lineas[lineas.length-1].trim().split(/\s+/);
    const fecha=datos[0]||"-";
    const hora=datos[1]||"-";
    const direccionCardinal=convertirGradosAPuntoCardinal(parseFloat(datos[7]||0));
    const intensidadNudos=datos[5]||0;

    return `<div class="popup-card">
      <div class="titulo">📡 ${nombre}</div>
      <div class="dato" style="justify-content:center;color:#555;">📅 Act: ${fecha} ${hora}</div><hr>
      <div class="dato"><span class="label">🌡 Temp:</span> ${datos[2]||"-"} °C</div>
      <div class="dato"><span class="label">💧 Humedad:</span> ${datos[3]||"-"} %</div>
      <div class="dato"><span class="label">🌫 Rocío:</span> ${datos[4]||"-"} °C</div>
      <div class="dato"><span class="label">🧭 Presión:</span> ${datos[10]||"-"} hPa</div>
      <div class="dato"><span class="label">🌬 Viento:</span> ${direccionCardinal} ${intensidadNudos} nds</div>
      <div class="dato"><span class="label">💨 Rachas:</span> ${datos[40]||"-"} nds</div>
      <div class="dato"><span class="label">🌧️ Lluvia:</span> ${datos[9]||"-"} mm</div>
    </div>`;
  }catch(e){
    return `<div class="popup-card">Error al cargar los datos: ${e.message}</div>`;
  }
}

async function cargarDatosWeatherLink(urlDatos,nombre){
  try{
    const response=await fetch(urlDatos);
    if(!response.ok) throw new Error(`Error de conexión: ${response.status}`);
    const datos=await response.json();
    const ultimaAct=(datos.ts||datos.time)
      ? new Date(datos.ts||datos.time).toLocaleString("es-CL",{hour12:false})
      : new Date().toLocaleString("es-CL",{hour12:false});

    return `<div class="popup-card">
      <div class="titulo">🌐 ${nombre}</div>
      <div class="dato" style="justify-content:center;color:#555;">📅 Act: ${ultimaAct}</div><hr>
      <div class="dato"><span class="label">🌡 Temp:</span> ${datos.temperature||"-"} °C</div>
      <div class="dato"><span class="label">💧 Humedad:</span> ${datos.humidity||"-"} %</div>
      <div class="dato"><span class="label">🧭 Presión:</span> ${datos.barometer||"-"} hPa</div>
      <div class="dato"><span class="label">🌬 Viento:</span> ${convertirGradosAPuntoCardinal(datos.windDirection||0)} ${datos.wind||0} nds</div>
      <div class="dato"><span class="label">💨 Rachas:</span> ${datos.gust||0} nds</div>
      <div class="dato"><span class="label">🌧️ Lluvia:</span> ${datos.rain||"-"} mm</div>
    </div>`;
  }catch(e){
    return `<div class="popup-card">Error al cargar WeatherLink: ${e.message}</div>`;
  }
}

// Mapa base y vista satelital.
const callejero=L.tileLayer(
  'https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19,attribution:'Tiles © Esri — Sources: Esri, HERE, Garmin, © OpenStreetMap contributors'}
);
const satelite=L.tileLayer(
  'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19,attribution:'Imagery © Esri and its contributors'}
);
const map=L.map('map',{layers:[callejero]}).setView([-41.5,-73],7);
L.control.layers({"Mapa callejero":callejero,"Satélite":satelite},null,{position:'topright'}).addTo(map);

let marcadores=[];

async function mostrarEstaciones(lista){
  marcadores.forEach(m=>map.removeLayer(m));
  marcadores=[];

  lista.forEach(est=>{
    const colorMarcador=est.tipo==="italca"?"purple":est.tipo==="weatherlink"?"#1E90FF":"green";
    const marker=L.circleMarker([est.lat,est.lng],{
      radius:10,color:"#fff",fillColor:colorMarcador,fillOpacity:.8,weight:2
    }).addTo(map);
    marker.estacion=est;

    marker.bindTooltip(est.nombre,{direction:'top',offset:[0,-10],className:'custom-tooltip'});
    marker.on('mouseover',function(){this.setRadius(14);this.setStyle({weight:4,fillOpacity:1});});
    marker.on('mouseout',function(){this.setRadius(10);this.setStyle({weight:2,fillOpacity:.8});});
    marcadores.push(marker);

    // Marca en naranja las estaciones sin actualización reciente.
    (async()=>{
      let ultimaFecha;
      try{
        const response=await fetch(est.urlDatos);
        if(!response.ok) return;

        if(est.tipo==="weatherlink"){
          const datos=await response.json();
          const ts=datos.ts||datos.time;
          if(ts) ultimaFecha=new Date(ts);
        }else if(est.tipo!=="italca"){
          const texto=await response.text();
          const lineas=texto.trim().split('\n');
          const datos=lineas[lineas.length-1].trim().split(/\s+/);
          const fecha=datos[0]||"-";
          const hora=datos[1]||"-";
          if(fecha!=="-"&&hora!=="-"){
            const partes=fecha.split("-");
            const dia=parseInt(partes[0],10);
            const mes=parseInt(partes[1],10)-1;
            let anio=parseInt(partes[2],10);
            if(anio<100) anio+=2000;
            const partesHora=hora.split(":");
            ultimaFecha=new Date(anio,mes,dia,parseInt(partesHora[0],10),parseInt(partesHora[1],10),parseInt(partesHora[2],10));
          }
        }
      }catch(e){}

      if(ultimaFecha&&(new Date()-ultimaFecha)/60000>10){
        marker.setStyle({color:"#fff",fillColor:"#FF4500"});
      }
    })();

    marker.on('click',async()=>{
      let contenido;
      if(est.tipo==="italca") contenido=await cargarDatosITALCA20(est.urlDatos,est.nombre);
      else if(est.tipo==="weatherlink") contenido=await cargarDatosWeatherLink(est.urlDatos,est.nombre);
      else contenido=await cargarDatos(est.urlDatos,est.nombre);
      marker.bindPopup(contenido).openPopup();
    });
  });
}

// Búsqueda y filtro por las cinco zonas.
let estacionesVisibles=estaciones;
function normalizarTexto(texto){
  return texto.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("es").trim();
}
function aplicarBusqueda(){
  const termino=normalizarTexto(document.getElementById("buscarEstacion").value);
  marcadores.forEach(marker=>{
    const coincide=!termino||normalizarTexto(marker.estacion.nombre).includes(termino);
    if(coincide&&!map.hasLayer(marker)) marker.addTo(map);
    if(!coincide&&map.hasLayer(marker)) map.removeLayer(marker);
  });
}
function actualizarSugerencias(lista){
  const datalist=document.getElementById("listaEstaciones");
  datalist.replaceChildren(...lista.map(estacion=>{
    const opcion=document.createElement("option");
    opcion.value=estacion.nombre;
    return opcion;
  }));
}
function estacionesDeZona(valor){
  const grupos={
    cuarzona:grupoCuarzona,prizona:grupoPrizona,sezona:grupoSezona,
    quinzona:grupoQuinzona,terzona:grupoTerzona
  };
  const grupo=grupos[valor];
  if(!grupo) return estaciones;
  const nombres=new Set(grupo.map(normalizarTexto));
  return estaciones.filter(estacion=>nombres.has(normalizarTexto(estacion.nombre)));
}

const campoBusqueda=document.getElementById("buscarEstacion");
const filtroEstaciones=document.getElementById("filtroEstaciones");
actualizarSugerencias(estaciones);
campoBusqueda.addEventListener("input",aplicarBusqueda);

filtroEstaciones.addEventListener("change",function(){
  estacionesVisibles=estacionesDeZona(this.value);
  campoBusqueda.value="";
  mostrarEstaciones(estacionesVisibles);
  actualizarSugerencias(estacionesVisibles);
});

async function verEstacionSeleccionada(){
  const termino=normalizarTexto(campoBusqueda.value);
  if(!termino) return;

  const estacion=estacionesVisibles.find(e=>normalizarTexto(e.nombre)===termino)
    ||estacionesVisibles.find(e=>normalizarTexto(e.nombre).includes(termino));
  if(!estacion) return;

  let marker=marcadores.find(m=>m.estacion===estacion);
  if(!marker){
    estacionesVisibles=[estacion];
    mostrarEstaciones(estacionesVisibles);
    marker=marcadores[0];
  }
  if(!map.hasLayer(marker)) marker.addTo(map);
  map.flyTo([estacion.lat,estacion.lng],Math.max(map.getZoom(),11),{duration:.8});
  marker.fire("click");
}
document.getElementById("verEstacion").addEventListener("click",verEstacionSeleccionada);
campoBusqueda.addEventListener("keydown",event=>{
  if(event.key==="Enter") verEstacionSeleccionada();
});

// Inicia mostrando todas las estaciones.
mostrarEstaciones(estaciones);
</script>
</body>
